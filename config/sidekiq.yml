---
:concurrency: 5
staging:
  :concurrency: 10
production:
  :concurrency: 2
:queues:
  - critical
  - mailers
  - it52_active_job_development_mailers
  - it52_active_job_production_mailers
  - default
  - low
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>.critical
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>.mailers
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>.default
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>.low
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>_critical
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>_mailers
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>_default
  - it52.<%= ENV.fetch('RAILS_ENV') { 'development' } %>_low
